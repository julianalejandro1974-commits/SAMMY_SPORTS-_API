<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de sesión | Sammy Sports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sammy.css">
</head>
<body class="auth-page">
<main class="card auth-card"><div class="auth-logo"><i class="bi bi-shield-check"></i></div><h1 class="h4 fw-bold text-center text-blue mb-1">SAMMY SPORTS</h1><p class="text-center text-secondary small mb-4">Portal de acceso administrativo</p>
  <form action="#" method="get">
    <div class="mb-3"><label for="correo" class="form-label small fw-semibold">Correo / usuario</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input id="correo" name="correo" type="email" class="form-control" placeholder="admin@sammysports.com" required></div></div>
    <div class="mb-3"><div class="d-flex justify-content-between"><label for="clave" class="form-label small fw-semibold">Contraseña</label><a href="Recuperarcontraseña.html" class="small text-decoration-none">¿Olvidaste tu contraseña?</a></div>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="clave" name="clave" type="password" class="form-control" placeholder="••••••••" required><button class="btn btn-outline-secondary" type="button" data-toggle-pw aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button></div></div>
    <button class="btn btn-sammy w-100 py-2" type="submit">Ingresar</button>
  </form>
  <p class="text-center small mt-3 mb-1">¿Aún no tienes cuenta? <a href="crearCuenta.html" class="fw-semibold text-decoration-none">Crear cuenta</a></p><a href="index.html" class="d-block text-center small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a la tienda</a><p class="auth-note"><i class="bi bi-lock me-1"></i>Entorno seguro. Solo personal autorizado.</p></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sammy.js"></script>
</body>
</html>
