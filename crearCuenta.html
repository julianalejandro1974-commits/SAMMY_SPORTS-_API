<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Sammy Sports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/sammy.css">
</head>
<body class="auth-page">
<main class="card auth-card"><div class="auth-logo"><i class="bi bi-shield-check"></i></div><h1 class="h4 fw-bold text-center text-blue mb-1">SAMMY SPORTS</h1><p class="text-center text-secondary small mb-4">Crea tu cuenta</p>
  <form action="#" method="get">
    <div class="mb-3"><label for="nombre" class="form-label small fw-semibold">Nombre completo</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input id="nombre" name="nombre" type="text" class="form-control" placeholder="Ej: Ana García" required></div></div>
    <div class="mb-3"><label for="correo" class="form-label small fw-semibold">Correo electrónico</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input id="correo" name="correo" type="email" class="form-control" placeholder="tu@correo.com" required></div></div>
    <div class="mb-3"><label for="telefono" class="form-label small fw-semibold">WhatsApp</label><div class="input-group"><span class="input-group-text"><i class="bi bi-whatsapp"></i></span><input id="telefono" name="telefono" type="tel" class="form-control" placeholder="+57 300 000 0000" required></div></div>
    <div class="mb-3"><label for="nueva" class="form-label small fw-semibold">Contraseña</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="nueva" name="nueva" type="password" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8" required><button class="btn btn-outline-secondary" type="button" data-toggle-pw aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button></div></div>
    <div class="mb-3"><label for="confirmar" class="form-label small fw-semibold">Confirmar contraseña</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock-fill"></i></span><input id="confirmar" name="confirmar" type="password" class="form-control" placeholder="Repite tu contraseña" required><button class="btn btn-outline-secondary" type="button" data-toggle-pw aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button></div></div>
    <p id="matchMsg" class="match-msg" aria-live="polite"></p>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label small text-secondary" for="terms">Acepto los términos de servicio y la política de privacidad.</label></div>
    <button class="btn btn-sammy w-100 py-2" type="submit">Crear cuenta</button>
  </form>
  <p class="text-center small mt-3 mb-1">¿Ya tienes cuenta? <a href="inicioSesion.html" class="fw-semibold text-decoration-none">Iniciar sesión</a></p>
  <a href="index.html" class="d-block text-center small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a la tienda</a><p class="auth-note"><i class="bi bi-lock me-1"></i>Entorno seguro. Solo personal autorizado.</p></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/sammy.js"></script>
</body>
</html>
